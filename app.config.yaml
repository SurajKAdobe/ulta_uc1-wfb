application:
  actions: actions
  web: web-src
  runtimeManifest:
    packages:
      ulta-wfb:
        license: Apache-2.0
        actions:
          presign-upload:
            function: actions/presign-upload/index.js
            web: 'yes'
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
            annotations:
              require-adobe-auth: false
              final: true

          execute-workflow:
            function: actions/execute-workflow/index.js
            web: 'yes'
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              WORKFLOW_ID: $WORKFLOW_ID
              IMS_USER_ID: $IMS_USER_ID
              API_KEY: $API_KEY
              IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
              IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
              IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
              IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
              WORKFLOW_TEMPLATE_NODE_ID: $WORKFLOW_TEMPLATE_NODE_ID
              WORKFLOW_ADDITIONAL_TEMPLATE_NODE_IDS: $WORKFLOW_ADDITIONAL_TEMPLATE_NODE_IDS
              WORKFLOW_SKU_NODE_ID: $WORKFLOW_SKU_NODE_ID
              WORKFLOW_FILENAME_NODE_ID: $WORKFLOW_FILENAME_NODE_ID
              WORKFLOW_BACKGROUND_NODE_ID: $WORKFLOW_BACKGROUND_NODE_ID
              WORKFLOW_TEMPLATE_SIZE_NODE_ID: $WORKFLOW_TEMPLATE_SIZE_NODE_ID
            annotations:
              require-adobe-auth: false
              final: true

          check-status:
            function: actions/check-status/index.js
            web: 'yes'
            runtime: nodejs:20
            limits:
              timeout: 180000
            inputs:
              LOG_LEVEL: info
              IMS_USER_ID: $IMS_USER_ID
              API_KEY: $API_KEY
              IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
              IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
              IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
              IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            annotations:
              require-adobe-auth: false
              final: true

          check-executions:
            function: actions/check-executions/index.js
            web: 'yes'
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              IMS_USER_ID: $IMS_USER_ID
              API_KEY: $API_KEY
              IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
              IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
              IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
              IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            annotations:
              require-adobe-auth: false
              final: true

          list-batches:
            function: actions/list-batches/index.js
            web: 'yes'
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              IMS_USER_ID: $IMS_USER_ID
              API_KEY: $API_KEY
              IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
              IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
              IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
              IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            annotations:
              require-adobe-auth: false
              final: true

          cancel-batch:
            function: actions/cancel-batch/index.js
            web: 'yes'
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              IMS_USER_ID: $IMS_USER_ID
              API_KEY: $API_KEY
              IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
              IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
              IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
              IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            annotations:
              require-adobe-auth: false
              final: true

          refresh-presign:
            function: actions/refresh-presign/index.js
            web: 'yes'
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
            annotations:
              require-adobe-auth: false
              final: true

          default-additional-templates:
            function: actions/default-additional-templates/index.js
            web: 'yes'
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
            annotations:
              require-adobe-auth: false
              final: true

          # One-off local-dev seeding action — see actions/seed-default-assets/index.js.
          # Only has real files to seed when run via `aio app dev` (psds/ and
          # web-src/src/assets/ aren't bundled into a deployed action).
          seed-default-assets:
            function: actions/seed-default-assets/index.js
            web: 'yes'
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
            annotations:
              require-adobe-auth: false
              final: true

          preview-payload:
            function: actions/preview-payload/index.js
            web: 'yes'
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              WORKFLOW_ID: $WORKFLOW_ID
              WORKFLOW_TEMPLATE_NODE_ID: $WORKFLOW_TEMPLATE_NODE_ID
              WORKFLOW_ADDITIONAL_TEMPLATE_NODE_IDS: $WORKFLOW_ADDITIONAL_TEMPLATE_NODE_IDS
              WORKFLOW_SKU_NODE_ID: $WORKFLOW_SKU_NODE_ID
              WORKFLOW_FILENAME_NODE_ID: $WORKFLOW_FILENAME_NODE_ID
              WORKFLOW_BACKGROUND_NODE_ID: $WORKFLOW_BACKGROUND_NODE_ID
              WORKFLOW_TEMPLATE_SIZE_NODE_ID: $WORKFLOW_TEMPLATE_SIZE_NODE_ID
            annotations:
              require-adobe-auth: false
              final: true

          # SKU Personalization — both call the Photoshop API v2 (actions/libs/photoshopV2.js),
          # reusing the same IMS OAuth Server-to-Server credential as run-workflow.adobe.io above.
          # v2 lives under a Firefly Services entitlement on that credential, not the legacy
          # "Photoshop API" one v1 used (v1 is retired for this account as of the psd-manifest
          # migration below).
          psd-manifest:
            function: actions/psd-manifest/index.js
            web: 'yes'
            runtime: nodejs:20
            limits:
              timeout: 180000
            inputs:
              LOG_LEVEL: info
              API_KEY: $API_KEY
              IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
              IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
              IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
              IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            annotations:
              require-adobe-auth: false
              final: true

          psd-composite:
            function: actions/psd-composite/index.js
            web: 'yes'
            runtime: nodejs:20
            limits:
              timeout: 300000
            inputs:
              LOG_LEVEL: $LOG_LEVEL
              API_KEY: $API_KEY
              IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
              IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
              IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
              IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            annotations:
              require-adobe-auth: false
              final: true

          # Harmonize — Workflow Builder graph 69997ca7... using the supplied
          # input-assets node instead of Photoshop Execute Actions.
          psd-harmonize:
            function: actions/psd-harmonize/index.js
            web: 'yes'
            runtime: nodejs:20
            limits:
              timeout: 280000
            inputs:
              LOG_LEVEL: $LOG_LEVEL
              IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
              IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
              IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
              API_KEY: $API_KEY
              IMS_USER_ID: $IMS_USER_ID
              IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
              HARMONIZE_WORKFLOW_ID: $HARMONIZE_WORKFLOW_ID
              HARMONIZE_INPUT_NODE_ID: $HARMONIZE_INPUT_NODE_ID
            annotations:
              require-adobe-auth: false
              final: true

          firefly-generate:
            function: actions/firefly-generate/index.js
            web: 'yes'
            runtime: nodejs:20
            limits:
              timeout: 60000
            inputs:
              LOG_LEVEL: info
              API_KEY: $API_KEY
              IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
              IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
              IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            annotations:
              require-adobe-auth: false
              final: true

          firefly-generation-status:
            function: actions/firefly-generation-status/index.js
            web: 'yes'
            runtime: nodejs:20
            limits:
              timeout: 120000
            inputs:
              LOG_LEVEL: info
              API_KEY: $API_KEY
              IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
              IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
              IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
            annotations:
              require-adobe-auth: false
              final: true

          # UC4 batch workflow — CSV in, Workflow Builder run, output PSDs feed
          # into the SKU Personalization editor above. Graph still in progress;
          # UC4_WORKFLOW_ID/UC4_WORKFLOW_INPUT_NODE_IDS are placeholders until
          # it's finalized (see actions/execute-uc4-workflow/index.js).
          execute-uc4-workflow:
            function: actions/execute-uc4-workflow/index.js
            web: 'yes'
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              API_KEY: $API_KEY
              IMS_USER_ID: $IMS_USER_ID
              IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
              IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
              IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
              IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
              UC4_WORKFLOW_ID: $UC4_WORKFLOW_ID
              UC4_INPUT_IMAGE_NODE_ID: $UC4_INPUT_IMAGE_NODE_ID
              UC4_INPUT_ROW_IMAGE_NODE_ID: $UC4_INPUT_ROW_IMAGE_NODE_ID
              UC4_INPUT_SKU_URLS_NODE_ID: $UC4_INPUT_SKU_URLS_NODE_ID
              UC4_INPUT_COLOR_NODE_ID: $UC4_INPUT_COLOR_NODE_ID
              UC4_INPUT_SIZE_NODE_ID: $UC4_INPUT_SIZE_NODE_ID
            annotations:
              require-adobe-auth: false
              final: true

          # Display-only mirror of execute-uc4-workflow's request shape — never
          # calls Workflow Builder, instant and free (no files to re-host).
          preview-uc4-workflow:
            function: actions/preview-uc4-workflow/index.js
            web: 'yes'
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              UC4_WORKFLOW_ID: $UC4_WORKFLOW_ID
              UC4_INPUT_IMAGE_NODE_ID: $UC4_INPUT_IMAGE_NODE_ID
              UC4_INPUT_ROW_IMAGE_NODE_ID: $UC4_INPUT_ROW_IMAGE_NODE_ID
              UC4_INPUT_SKU_URLS_NODE_ID: $UC4_INPUT_SKU_URLS_NODE_ID
              UC4_INPUT_COLOR_NODE_ID: $UC4_INPUT_COLOR_NODE_ID
              UC4_INPUT_SIZE_NODE_ID: $UC4_INPUT_SIZE_NODE_ID
            annotations:
              require-adobe-auth: false
              final: true

          # UC2B banner generation — CSV + PSD template in, one Workflow Builder
          # execution total (not one per row like UC1/UC4 — see
          # actions/execute-uc2b-workflow/index.js).
          execute-uc2b-workflow:
            function: actions/execute-uc2b-workflow/index.js
            web: 'yes'
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              API_KEY: $API_KEY
              IMS_USER_ID: $IMS_USER_ID
              IMS_OAUTH_S2S_CLIENT_ID: $IMS_OAUTH_S2S_CLIENT_ID
              IMS_OAUTH_S2S_CLIENT_SECRET: $IMS_OAUTH_S2S_CLIENT_SECRET
              IMS_OAUTH_S2S_ORG_ID: $IMS_OAUTH_S2S_ORG_ID
              IMS_OAUTH_S2S_SCOPES: $IMS_OAUTH_S2S_SCOPES
              UC2B_WORKFLOW_ID: $UC2B_WORKFLOW_ID
              UC2B_INPUT_CSV_NODE_ID: $UC2B_INPUT_CSV_NODE_ID
              UC2B_INPUT_TEMPLATE_NODE_ID: $UC2B_INPUT_TEMPLATE_NODE_ID
            annotations:
              require-adobe-auth: false
              final: true

          # Display-only mirror of execute-uc2b-workflow's request shape — never
          # calls Workflow Builder, instant and free (no files to re-host).
          preview-uc2b-workflow:
            function: actions/preview-uc2b-workflow/index.js
            web: 'yes'
            runtime: nodejs:20
            inputs:
              LOG_LEVEL: info
              UC2B_WORKFLOW_ID: $UC2B_WORKFLOW_ID
              UC2B_INPUT_CSV_NODE_ID: $UC2B_INPUT_CSV_NODE_ID
              UC2B_INPUT_TEMPLATE_NODE_ID: $UC2B_INPUT_TEMPLATE_NODE_ID
            annotations:
              require-adobe-auth: false
              final: true
